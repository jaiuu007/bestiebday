<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crackers & Music Page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
      background-image: url("background1.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    /* Firecracker Canvas */
    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    /* Music Box (bottom-left) */
    .music-box {
      position: fixed;
      bottom: 1.25rem;
      left: 1.25rem;
      max-width: 100%;
      width: 320px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 999px;
      padding: 0.5rem 1rem;
      box-shadow: 0 0 15px rgba(251, 255, 7, 0.7);
    }

    audio.music-box {
      width: 100%;
    }

    /* Slider wrapper */
    .slider-container {
      width: 100%;
      max-width: 900px;
      overflow: hidden;
      border-radius: 24px;
      margin: 5rem auto 7rem auto;
      position: relative;
    }

    .slider {
      display: flex;
      width: max-content;
      animation: slide 210s infinite linear;
    }

    .slider img {
      display: block;
      width: 100vw;
      max-width: 900px;
      height: auto;
      border: 6px solid #000;
      border-radius: 24px;
      object-fit: cover;
    }

    @keyframes slide {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    /* Bottom Redirect Button */
    .fixed-button {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      border: 3px solid #000;
      border-radius: 999px;
      cursor: pointer;
      background-color: rgb(248, 191, 47);
      color: rgb(60, 48, 48);
      padding: 0.5rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .fixed-button p {
      margin: 0;
      font-weight: 700;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: 1.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 16px;
      border: 2px solid #000;
    }

    .fixed-button:hover {
      background-color: rgb(242, 19, 19);
      color: #fff;
    }

    /* Mobile-first adjustments */
    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }

      .slider-container {
        margin-top: 4.5rem;
        margin-bottom: 6.5rem;
        border-radius: 16px;
      }

      .slider img {
        width: 100%;
        max-width: 100%;
        border-width: 4px;
        border-radius: 16px;
      }

      .music-box {
        width: calc(100% - 2.5rem);
        left: 1.25rem;
        bottom: 5rem;
        border-radius: 24px;
      }

      .fixed-button {
        width: 180px;
        padding: 0.5rem 1rem;
      }

      .fixed-button p {
        font-size: 1.25rem;
      }
    }

    /* Larger screens */
    @media (min-width: 769px) {
      .fixed-button {
        width: 260px;
      }

      .fixed-button p {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>
  <!-- Firecracker Canvas -->
  <canvas id="fireworks"></canvas>

  <!-- Music Box (Bottom Left) -->
  <audio id="bgMusic" autoplay loop controls class="music-box">
    🎵🎧
    <source src="aankhone me teri.mpeg" type="audio/mpeg" />
    Your browser does not support the audio element.
  </audio>

  <!-- Image Slider (Centered) -->
  <div class="slider-container">
    <div class="slider">
      <!-- paste your full <img> list here as before -->
      <img src="1 (1).jpg" alt="Image 1" />
      <img src="1 (2).jpg" alt="Image 2" />
      <!-- ... all remaining images ... -->
    </div>
  </div>

  <!-- Bottom Button for Redirection -->
  <button class="fixed-button" onclick="redirect()">
    <p>Home</p>
  </button>

  <script>
    function redirect() {
      window.location.href = "index.html";
    }

    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    let particles = [];

    function createParticle(x, y) {
      for (let i = 0; i < 50; i++) {
        particles.push({
          x: x,
          y: y,
          size: Math.random() * 5 + 1,
          speedX: Math.random() * 5 - 2.5,
          speedY: Math.random() * 5 - 2.5,
          color: `hsl(${Math.random() * 360}, 100%, 50%)`,
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((particle, index) => {
        particle.x += particle.speedX;
        particle.y += particle.speedY;
        particle.size *= 0.95;

        ctx.fillStyle = particle.color;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
        ctx.fill();

        if (particle.size < 0.5) particles.splice(index, 1);
      });

      requestAnimationFrame(animateParticles);
    }

    function launchFireworks() {
      setInterval(() => {
        const randomX = Math.random() * canvas.width;
        const randomY = Math.random() * canvas.height;
        createParticle(randomX, randomY);
      }, 500);
    }

    window.onload = () => {
      launchFireworks();
      animateParticles();

      const music = document.getElementById("bgMusic");
      music.play().catch(() => {
        console.log("User interaction required for autoplay.");
      });
    };
  </script>
</body>
</html>
